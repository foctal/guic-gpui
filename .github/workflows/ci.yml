name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev xvfb xauth
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --features guic-gpui-linux/test-support --locked
      - name: Check Linux backend feature combinations
        run: |
          cargo check -p guic-gpui-linux --no-default-features --locked
          cargo check -p guic-gpui-linux --no-default-features --features x11 --locked
          cargo check -p guic-gpui-linux --no-default-features --features wayland --locked
      - name: Test native X11 file clipboard
        run: xvfb-run -a cargo test -p guic-gpui-linux --features test-support --lib native_file_clipboard_round_trip --locked -- --ignored
      - name: Test native X11 asynchronous text clipboard
        run: xvfb-run -a cargo test -p guic-gpui-linux --features test-support --lib native_text_clipboard_reads_on_worker --locked -- --ignored

  platform-check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo check --workspace --locked
      - run: cargo test -p guic-gpui --lib --locked
      - name: Test Core Media buffers
        if: runner.os == 'macOS'
        run: cargo test -p guic-gpui-media --locked
      - name: Test Windows backend
        if: runner.os == 'Windows'
        run: cargo test -p guic-gpui-windows --features test-support --lib --locked
      - name: Check macOS font-kit backend
        if: runner.os == 'macOS'
        run: cargo check -p guic-gpui-macos --features font-kit --locked
      - name: Test macOS font-kit backend
        if: runner.os == 'macOS'
        run: cargo test -p guic-gpui-macos --features font-kit --locked
      - name: Test macOS asynchronous text clipboard
        if: runner.os == 'macOS'
        run: cargo test -p guic-gpui-macos --features font-kit --lib system_helper_reads_unicode_text_off_thread --locked -- --ignored
      - name: Check and test macOS font-kit with core-foundation 0.10.0
        if: runner.os == 'macOS'
        run: |
          cargo update -p core-foundation --precise 0.10.0
          cargo check -p guic-gpui-macos --features font-kit --locked
          cargo test -p guic-gpui-macos --features font-kit --locked
